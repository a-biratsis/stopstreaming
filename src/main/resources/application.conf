# stopstreaming configuration (HOCON format)
# Load at runtime via: StopConfigLoader.load()
# Note: job ID / job name are derived automatically from the StreamingQuery at runtime.

stopstreaming {

  # Active backend: "rest" or "filesystem"
  backend = "rest"

  rest {
    host      = "0.0.0.0"
    port      = 8558
    stop-path = "/stop"
  }

  filesystem {
    stop-dir = "/tmp/stopstreaming"
    fs-type  = "LocalFileSystem"   # LocalFileSystem | DBFS
  }
}
